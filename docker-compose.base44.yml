services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -lc "npm install && node /tmp/seed-auth.js && npx --yes base44@latest dev"
    volumes:
      - .:/app
      - ./seed-auth.js:/tmp/seed-auth.js:ro
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
      - base44_config:/root/.base44
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      npm_config_min_release_age: "7"
    stdin_open: true
    tty: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  node_modules:
  npm_cache:
  base44_config:
